<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SENTRY-X logo</title>
<desc>A hexagonal mark containing a node graph shaped like a cross, with the SENTRY-X wordmark below in monospace type.</desc>

<!-- hexagon frame -->
<polygon points="340,40 420,85 420,175 340,220 260,175 260,85" fill="none" stroke="#1D9E75" stroke-width="2"/>

<!-- node graph forming an X inside -->
<g stroke="#1D9E75" stroke-width="1.5">
  <line x1="290" y1="90" x2="390" y2="170"/>
  <line x1="390" y1="90" x2="290" y2="170"/>
  <line x1="290" y1="90" x2="340" y2="130"/>
  <line x1="390" y1="90" x2="340" y2="130"/>
  <line x1="290" y1="170" x2="340" y2="130"/>
  <line x1="390" y1="170" x2="340" y2="130"/>
</g>
<g fill="#0F6E56">
  <circle cx="290" cy="90" r="5"/>
  <circle cx="390" cy="90" r="5"/>
  <circle cx="290" cy="170" r="5"/>
  <circle cx="390" cy="170" r="5"/>
</g>
<circle cx="340" cy="130" r="7" fill="#D85A30"/>

<!-- wordmark -->
<text x="340" y="265" text-anchor="middle" font-family="monospace" font-size="34" font-weight="700" fill="#0F6E56" letter-spacing="4">SENTRY-X</text>
<text x="340" y="292" text-anchor="middle" font-family="monospace" font-size="13" fill="#5F5E5A" letter-spacing="2">AUTHORIZED RECON &amp; AI ANALYSIS</text>
</svg>
