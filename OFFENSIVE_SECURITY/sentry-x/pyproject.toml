[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentryx"
version = "0.1.0"
description = "AI-assisted authorized recon & vulnerability analysis CLI"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
sentryx = "sentryx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sentryx --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", "venv"]
